# Shared by the app and the one-shot migrate service.
x-displayhive-env: &displayhive-env
  DATABASE_URL: postgresql+psycopg2://displayhive:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/displayhive
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  # The address people reach this instance at, e.g. https://signage.example.com
  # CORS and the SSO redirect URI are derived from it.
  PUBLIC_URL: ${PUBLIC_URL:-}
  # Comma-separated allowed origins for the API / Socket.IO. Unset: PUBLIC_URL
  # when that is set, otherwise "*" (any origin — fine for a first try, not
  # for production).
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${PUBLIC_URL:-*}}
  # Initial admin account (created on first start if no users exist).
  ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
  ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
  ADMIN_BOOTSTRAP_MUST_CHANGE: ${ADMIN_BOOTSTRAP_MUST_CHANGE:-on}
  # Number of reverse proxies in front of the app (0 = reached directly).
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # "json": one JSON object per log line (for log collectors); default "text".
  LOG_FORMAT: ${LOG_FORMAT:-text}
  # Backups (see docs/user/installation.md, "Backup & restore"): a database
  # backup every BACKUP_INTERVAL_HOURS (0 = off), keeping BACKUP_KEEP of them,
  # and one before every migration (MIGRATION_BACKUP=off to skip).
  BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
  BACKUP_KEEP: ${BACKUP_KEEP:-7}
  MIGRATION_BACKUP: ${MIGRATION_BACKUP:-on}

services:
  # Brings the database schema up to date — after a backup — and exits. The app
  # waits for it; if it fails, the app does not start (and nothing restarts in a
  # loop): read its log with `docker compose logs migrate`.
  migrate:
    image: ghcr.io/displayhive/displayhive:latest
    #build: .
    command: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment: *displayhive-env
    volumes:
      # Where the backups go (also mounted by the app, which makes the scheduled ones).
      - backups:/data/backups

  displayhive:
    image: ghcr.io/displayhive/displayhive:latest
    #build: .
    container_name: displayhive
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *displayhive-env
      MIGRATE_ON_START: "0"   # the migrate service did it
    ports:
      - 5000:5000
    volumes:
      # Uploaded media and generated previews must survive container upgrades.
      # They live in DATA_DIR (/data in the image). Before DATA_DIR these same
      # volumes were mounted at /app/static/media* — same volumes, so moving
      # the mount point is the whole migration.
      - media:/data/media
      - media_previews:/data/media_previews
      - media_renditions:/data/media_renditions
      # Database dumps (daily, and before each migration). On the same disk as the
      # data, so also copy them elsewhere — or bind-mount a directory on another disk here.
      - backups:/data/backups

  db:
    image: postgres:16-alpine
    container_name: displayhive-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: displayhive
      POSTGRES_USER: displayhive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U displayhive -d displayhive"]
      interval: 5s
      timeout: 5s
      retries: 10
      
volumes:
  media:
  media_previews:
  media_renditions:
  backups:
  pgdata:
