name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    strategy:
      fail-fast: false
      matrix:
        app: [admin, screen]
        include:
          - app: admin
            test_script: test:unit
          - app: screen
            test_script: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontends/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        # No spec files exist yet in either frontend — --passWithNoTests keeps
        # this from failing until real tests are added, while still failing
        # the build on an actual test failure once there are some.
        run: npm run ${{ matrix.test_script }} -- --passWithNoTests

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The locked versions: runtime pins identical to the Docker image's.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest

  backend-postgres:
    # The suite normally runs on SQLite. This job runs the same tests on the
    # PostgreSQL the Docker image uses, after migrating an empty database
    # with `alembic upgrade head` — so a migration that only breaks on
    # Postgres fails here.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: displayhive
          POSTGRES_PASSWORD: displayhive
          POSTGRES_DB: displayhive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U displayhive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://displayhive:displayhive@localhost:5432/displayhive
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migrate the empty database (alembic upgrade head)
        run: alembic upgrade head

      # Fails when a model change has no migration (or a migration drifts
      # from the models) — write the migration, don't relax this check.
      - name: Check the migrations match the models
        run: alembic check

      - name: Run pytest on PostgreSQL
        run: pytest

  python-locks:
    # Fails when requirements.txt / requirements-dev.txt don't match their .in
    # inputs — someone edited an .in file without running `npm run deps:lock`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Regenerate the lock files
        run: sh scripts/lock-python-deps.sh

      - name: Compare with the committed ones
        run: git diff --exit-code -- requirements.txt requirements-dev.txt
