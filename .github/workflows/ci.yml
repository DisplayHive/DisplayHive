name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    strategy:
      fail-fast: false
      matrix:
        app: [admin, screen]
        include:
          - app: admin
            test_script: test:unit
          - app: screen
            test_script: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontends/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests with coverage
        # --passWithNoTests: a package without any spec file must not fail the
        # build; an actual test failure still does.
        run: npm run ${{ matrix.test_script }} -- --run --coverage --passWithNoTests

      # Shown on the run's summary page; informational, nothing fails on it.
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo '### ${{ matrix.app }} frontend coverage'
              echo '| Lines | Statements | Branches | Functions |'
              echo '| ---: | ---: | ---: | ---: |'
              jq -r '.total | "| \(.lines.pct)% | \(.statements.pct)% | \(.branches.pct)% | \(.functions.pct)% |"' coverage/coverage-summary.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The locked versions: runtime pins identical to the Docker image's.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: pytest -n auto --cov --cov-report=term

      # Shown on the run's summary page; informational, nothing fails on it.
      # The CI never writes back to the repository (no coverage badge commit).
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Backend coverage (line + branch)'
            coverage report --format=markdown --skip-covered
          } >> "$GITHUB_STEP_SUMMARY"

  backend-postgres:
    # The suite normally runs on SQLite. This job runs the same tests on the
    # PostgreSQL the Docker image uses, after migrating an empty database
    # with `alembic upgrade head` — so a migration that only breaks on
    # Postgres fails here.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: displayhive
          POSTGRES_PASSWORD: displayhive
          POSTGRES_DB: displayhive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U displayhive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # alembic and `alembic check` use DATABASE_URL; the test suite always
      # sets its own, from TEST_DATABASE_URL (see tests/conftest.py).
      DATABASE_URL: postgresql+psycopg2://displayhive:displayhive@localhost:5432/displayhive
      TEST_DATABASE_URL: postgresql+psycopg2://displayhive:displayhive@localhost:5432/displayhive
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The backup tests dump and restore a real database; the tools must be
      # the server's major version (see application/backup.py).
      - name: Install the PostgreSQL 16 client tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client-16

      - name: Migrate the empty database (alembic upgrade head)
        run: alembic upgrade head

      # Fails when a model change has no migration (or a migration drifts
      # from the models) — write the migration, don't relax this check.
      - name: Check the migrations match the models
        run: alembic check

      - name: Run pytest on PostgreSQL
        run: pytest

  python-locks:
    # Fails when requirements.txt / requirements-dev.txt don't match their .in
    # inputs — someone edited an .in file without running `npm run deps:lock`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Regenerate the lock files
        run: sh scripts/lock-python-deps.sh

      - name: Compare with the committed ones
        run: git diff --exit-code -- requirements.txt requirements-dev.txt

  nix-package:
    # The NixOS module runs the Nix package: it must build, and its pinned hashes (nix/hashes.nix) must
    # match the lock files. Fails with a hint when a lock file changed without `nix run .#update-hashes`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Evaluate the flake
        run: nix flake check --no-build

      - name: Build the package
        run: |
          nix build .#default -L || {
            echo "::error::The Nix package did not build. If a package-lock.json or requirements.txt changed, run 'nix run .#update-hashes' and commit nix/hashes.nix."
            exit 1
          }

      - name: Smoke test the built package
        run: |
          DATABASE_URL=sqlite:///$RUNNER_TEMP/nix-smoke.db DATA_DIR=$RUNNER_TEMP/nix-smoke \
            SECRET_KEY=smoke-test result/bin/displayhive-python -m flask dh migrate
