name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    strategy:
      fail-fast: false
      matrix:
        app: [admin, screen]
        include:
          - app: admin
            test_script: test:unit
          - app: screen
            test_script: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontends/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        # No spec files exist yet in either frontend — --passWithNoTests keeps
        # this from failing until real tests are added, while still failing
        # the build on an actual test failure once there are some.
        run: npm run ${{ matrix.test_script }} -- --passWithNoTests

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        # No test_*.py files exist yet — pytest exits 5 ("no tests collected")
        # in that case; treat that specific exit code as success so CI stays
        # green until a real suite is added, without masking actual failures.
        run: pytest || [ $? -eq 5 ]
