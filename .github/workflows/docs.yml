name: docs

on:
  push:
    branches: [main, development, release/1.0]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; skip stacking runs, let the latest win.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The public site is always main. The docs of the other lines are built next to it, under
      # /devbranch/ (development, the next major version) and /v1.0/ (release/1.0, the release
      # candidate; skipped while that branch does not exist). Nothing links there, and robots.txt
      # keeps them out of search engines. main predates .python-version/requirements/requirements-dev.txt,
      # so the tooling comes from development.
      - uses: actions/checkout@v7
        with:
          ref: development

      - uses: actions/checkout@v7
        with:
          ref: main
          path: main-docs

      - name: Check out the release/1.0 docs (when that branch exists)
        id: rc
        run: |
          if git fetch --depth=1 origin release/1.0; then
            git worktree add --detach rc-docs FETCH_HEAD
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Install MkDocs
        run: pip install -r requirements/requirements-dev.txt

      - name: Build main docs
        working-directory: main-docs
        run: mkdocs build --strict --site-dir ../site

      - name: Build development docs
        run: mkdocs build --strict --site-dir site/devbranch

      - name: Build release/1.0 docs
        if: steps.rc.outputs.present == 'true'
        working-directory: rc-docs
        run: mkdocs build --strict --site-dir ../site/v1.0

      - name: Keep the development and release candidate docs out of search engines
        run: |
          printf 'User-agent: *\nDisallow: /devbranch/\nDisallow: /v1.0/\n' > site/robots.txt

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
