name: docs

on:
  push:
    branches: [main, development]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; skip stacking runs, let the latest win.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The public site is always main; the development docs are built next to it under
      # /devbranch/. Nothing links there, and robots.txt keeps it out of search engines.
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - uses: actions/checkout@v7
        with:
          ref: development
          path: development

      - uses: actions/setup-python@v7
        with:
          python-version-file: main/.python-version

      - name: Install MkDocs
        run: pip install -r main/requirements-dev.txt

      - name: Build main docs
        working-directory: main
        run: mkdocs build --strict --site-dir ../site

      - name: Build development docs
        working-directory: development
        run: mkdocs build --strict --site-dir ../site/devbranch

      - name: Keep the development docs out of search engines
        run: |
          printf 'User-agent: *\nDisallow: /devbranch/\n' > site/robots.txt

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
