name: e2e

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements/requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Both frontends are built up front: the admin SPA is served via
      # `vite preview` (started by Playwright's webServer, see
      # e2e/playwright.config.ts), and the screen client's dist/ is
      # served by Flask itself, so both need a prior `npm run build`.
      - name: Install and build admin frontend
        working-directory: frontends/admin
        run: |
          npm ci
          npm run build

      - name: Install and build screen frontend
        working-directory: frontends/screen
        run: |
          npm ci
          npm run build

      - name: Install e2e test dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright e2e tests
        working-directory: e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
