[alembic]
script_location = migrations
# Not used: migrations/env.py always sets the URL (DATABASE_URL, or the
# SQLite path from application/paths.py). Kept only because Alembic expects it.
sqlalchemy.url = sqlite:///project.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
# use stderr to ensure it works when sys isn't injected
args = (sys.stderr,)
level = NOTSET

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
